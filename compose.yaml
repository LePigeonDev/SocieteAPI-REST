services:

  mysql:
    image: mysql:8.4
    container_name: mysql-societe
    restart: "no"

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s	
     
  keycloak-db:
    image: postgres:17-alpine
    container_name: keycloak-db-societe
    restart: "no"

    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}

    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: keycloak-societe
    restart: "no"

    command: start-dev --import-realm

    depends_on:
      keycloak-db:
        condition: service_healthy

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Required}

      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?Required}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Required}

    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro

    ports:
      - "127.0.0.1:8081:8080"

  api:
    image: api-societe:1.1
    build:
      context: .
      dockerfile: Dockerfile

    container_name: api-societe
    restart: "no"

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_JPA_SHOW_SQL: "true"

      KEYCLOAK_HOSTNAME: ${KEYCLOAK_HOSTNAME}
    ports:
      - "127.0.0.1:8080:8080"

  
  analytics:
    image: analytics-societe:1.0
    build:
      context: ./analytics
      dockerfile: Dockerfile

    container_name: analytics-societe
    restart: "no"

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      PYTHONUNBUFFERED: "1"


volumes:
  mysql_data:
  keycloak_db_data:
