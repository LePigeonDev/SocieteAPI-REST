spring.application.name=api

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_HOSTNAME}/realms/societe
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/societe/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=societe-api